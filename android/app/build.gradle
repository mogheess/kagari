apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * Release builds ship one APK per ABI plus a universal APK. Nearly every phone
 * only needs arm64-v8a, and bundling all four ABIs' native libraries roughly
 * triples the download. Debug builds (and CI) stay a single APK.
 *
 * Every APK keeps the same versionCode, as Mihon's do. Per-ABI offsets are only
 * needed for Play Store multi-APK; for sideloaded builds they'd stop people
 * moving between the universal APK and a split one, since one of the two would
 * always count as a downgrade.
 */
def abiSplitsEnabled = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
def splitAbis = (findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a,x86,x86_64")
    .split(",").collect { it.trim() }.findAll { !it.isEmpty() }

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.manhwa"
    defaultConfig {
        applicationId "app.kagari"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "0.6.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Configure these in ~/.gradle/gradle.properties (NEVER commit them):
            //   KAGARI_STORE_FILE=/abs/path/to/kagari-release.keystore
            //   KAGARI_STORE_PASSWORD=...
            //   KAGARI_KEY_ALIAS=kagari
            //   KAGARI_KEY_PASSWORD=...
            // Generate one with:
            //   keytool -genkeypair -v -keystore kagari-release.keystore \
            //     -alias kagari -keyalg RSA -keysize 2048 -validity 10000
            if (project.hasProperty('KAGARI_STORE_FILE')) {
                storeFile file(project.property('KAGARI_STORE_FILE'))
                storePassword project.property('KAGARI_STORE_PASSWORD')
                keyAlias project.property('KAGARI_KEY_ALIAS')
                keyPassword project.property('KAGARI_KEY_PASSWORD')
            }
        }
    }
    splits {
        abi {
            enable abiSplitsEnabled
            reset()
            include(*splitAbis)
            universalApk true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Uses the real release keystore when configured (see above);
            // otherwise falls back to the debug key so local release builds
            // still succeed. Do NOT ship a debug-signed APK to users.
            signingConfig project.hasProperty('KAGARI_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

kotlin {
    compilerOptions {
        // The vendored `eu.kanade.tachiyomi` interfaces give bodies to members
        // that extensions may not override (notably the extension-lib 1.6
        // suspend API). Without JVM default methods those bodies only exist in
        // a synthetic `Interface$DefaultImpls` that only classes compiled
        // against it can reach, so an extension APK built elsewhere would hit
        // AbstractMethodError. ENABLE emits real default methods and still
        // keeps DefaultImpls for anything expecting the old scheme. It is
        // Kotlin's default since 2.2; it's spelled out because it matters here.
        jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.ENABLE
    }
}

// Release APKs are named for the release page: Kagari-v0.7.0-arm64-v8a.apk,
// Kagari-v0.7.0-universal.apk, ...
android.applicationVariants.all { variant ->
    if (variant.buildType.name != "release") return
    variant.outputs.all { output ->
        def abi = output.getFilter("ABI") ?: "universal"
        outputFileName = "Kagari-v${variant.versionName}-${abi}.apk"
    }
}

// Keep the whole OkHttp/Okio family on a single version. React Native, Fresco
// and the extension engine each drag in different OkHttp modules (okhttp,
// okhttp-urlconnection, okhttp-android, ...) at different versions; if any one
// stays on 4.x while another is 5.x, classes like `okhttp3.JavaNetCookieJar`
// (4.x) end up referencing `okhttp3.internal.Util` (removed in 5.x) and the app
// crashes at runtime with NoClassDefFoundError. Forcing the group guarantees a
// coherent set of classes regardless of who requested what.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.squareup.okhttp3") {
            details.useVersion("5.4.0")
            details.because("Align all OkHttp modules to 5.x (extensions require it; mixed 4.x/5.x crashes)")
        }
        if (details.requested.group == "com.squareup.okio") {
            details.useVersion("3.17.0")
            details.because("The Okio version OkHttp 5.4.0 is built against")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // --- Extension engine runtime ---
    // These libraries must be present at runtime under their original package
    // names, because Tachiyomi/Mihon extension APKs are compiled against them
    // as `compileOnly` and resolve their symbols from the host process.
    // Versions mirror keiyoushi/extensions-source's version catalog so the
    // extension bytecode links against compatible classes.
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")
    // Extensions' generated serializers call into this runtime, and a runtime
    // older than the one they were built against fails at parse time (1.7.x
    // lacked a default method current serializers rely on, and every list
    // hung with AbstractMethodError). Keep it at keiyoushi's version; that
    // needs a Kotlin compiler that can read its metadata (see kotlinVersion).
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
    // Okio integration for kotlinx-serialization. Extensions parse JSON bodies
    // via `Json.decodeFromBufferedSource(...)` (class
    // `kotlinx.serialization.json.okio.OkioStreamsKt`); without this the source
    // throws NoClassDefFoundError at parse time.
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0")
    // OkHttp/Okio must match keiyoushi/extensions-source's catalog: modern
    // extensions are compiled against OkHttp 5.x and reference classes that only
    // exist there (e.g. `okhttp3.internal._UtilCommonKt`). Shipping OkHttp 4.x on
    // the host makes the extension's own dispatcher callback throw
    // NoClassDefFoundError and crash the process when opening a manga.
    implementation("com.squareup.okhttp3:okhttp:5.4.0")
    // `okhttp3.JavaNetCookieJar` lives in this artifact, not in `okhttp`. React
    // Native's networking/Fresco image stack (ReactCookieJarContainer) loads it,
    // and the 4.x copy references `okhttp3.internal.Util`, which 5.x deleted.
    // Pin it to the same 5.x line as okhttp so the cookie jar links against the
    // 5.x internals that are actually present (otherwise loading uncached covers
    // crashes with NoClassDefFoundError: okhttp3/internal/Util).
    implementation("com.squareup.okhttp3:okhttp-urlconnection:5.4.0")
    // keiyoushi's `core` module (every current extension inherits its KeiSource
    // base class) compiles against these as app-provided, exactly like Mihon
    // ships them. KeiSource touches Brotli/Zstd while building its client and
    // the first request throws NoClassDefFoundError without them; quickjs is
    // used by sources that evaluate site scripts. Versions follow
    // keiyoushi/extensions-source/gradle/libs.versions.toml.
    implementation("com.squareup.okhttp3:okhttp-brotli:5.4.0")
    implementation("com.squareup.okhttp3:okhttp-zstd:5.4.0")
    implementation("com.squareup.zstd:zstd-kmp-okio:0.4.0")
    implementation("com.github.zhanghai.quickjs-java:quickjs-android:547f5b1597")
    implementation("com.squareup.okio:okio:3.17.0")
    implementation("org.jsoup:jsoup:1.22.2") // keiyoushi compiles against this line
    // RxJava 1 is required by extensions that implement the fetch* Observable
    // methods (Tachiyomi's primary source API).
    implementation("io.reactivex:rxjava:1.3.8")
    // Dependency injection. Extensions call `injectLazy()` / `Injekt.get()`,
    // whose inlined bytecode targets this exact Injekt fork (published on
    // JitPack and used by keiyoushi/extensions-source).
    implementation("com.github.null2264.injekt:injekt-core:4135455a2a")
    // Extensions implementing ConfigurableSource reference androidx.preference
    // classes (PreferenceScreen, EditTextPreference, ...) at runtime.
    implementation("androidx.preference:preference-ktx:1.2.1")

    // On-device tests for the Cloudflare interceptor: a real WebView against a
    // local mock server, since no source can be relied on to challenge the
    // emulator's network on demand.
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:rules:1.6.1")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("com.squareup.okhttp3:mockwebserver3:5.4.0")
    // Storage Access Framework access to the user-chosen download folder.
    implementation("androidx.documentfile:documentfile:1.0.1")
    // Periodic new-chapters check while the app is closed.
    implementation("androidx.work:work-runtime-ktx:2.10.1")
}
